name: citest

on:
  push:
  pull_request:
  release:

permissions:
  contents: read

jobs:
  citest:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      THRUK_SOURCE: ${{ github.workspace }}/.thruk-source
    steps:
      - uses: actions/checkout@v4

      - name: Check out Thruk documentation and logos
        uses: actions/checkout@v4
        with:
          repository: sni/thruk
          path: .thruk-source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: build and test the site
        run: |
          make test
